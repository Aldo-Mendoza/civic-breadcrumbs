name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prevent private data in source control
        run: python scripts/check_repository_security.py
      - name: Install project and advisory scanner
        run: python -m pip install -r backend/requirements.txt pip-audit
      - name: Audit dependency vulnerabilities
        run: python -m pip_audit -r backend/requirements.txt
      - name: Run regression suite
        working-directory: backend
        env:
          AI_ENABLED: "false"
          DATABASE_URL: "sqlite:///:memory:"
        run: python manage.py test
